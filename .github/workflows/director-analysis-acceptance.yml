name: Director analysis and navigation acceptance
on:
  push:
    branches: [codex/wo62b-public-release-20261110]
    paths: ['index.html', 'staging/**', 'backend/fixture-delivery/**', 'test/**', '.github/workflows/director-analysis-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - name: Select installed Chromium
        run: |
          chromium_path="$(command -v google-chrome || command -v chromium)"
          echo "MM_TEST_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
          echo "PWA_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Verify restored presentation, history, and bounded source data
        run: >-
          node --test --test-isolation=none
          test/published-detail-restoration.test.mjs
          test/navigation-history.test.mjs
          test/analysis-data-projection.test.mjs
          test/analysis-data-sql.test.mjs
          test/international-display.test.mjs
          test/wo62b-engine-preservation.test.mjs
          test/wo62b-public-boundary.test.mjs
