# Offline draft-only release integration, with no network-backed application data requests.
name: Build 357 integration
on:
  push:
    branches:
      - integration/build357-safe-release-20261101
      - codex/build357-takeover-20261101
      - codex/settlement-ordering-20261101
      - codex/release-remediation-20261101
      - codex/search-accessibility-20261102
      - codex/account-ownership-20261102
      - codex/combined-security-20261102
      - codex/release-final-20261102
      - codex/public-fixture-remediation-20261102
      - claude/release-acceptance-20261106
      - claude/blocker-closure-20261106
      - claude/staging-s1-s2-20261107
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'test/**'
      - 'backend/fixture-delivery/**'
      - 'robot/**'
      - '.github/workflows/build357-integration.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # BUILD 357 - fail-fast CANCELLED Node 24 the moment Node 20 failed, which is why the
      # verified head of PR #23 carries a Node 20 failure and NO Node 24 result at all. A
      # cancelled job is not a passing job and must never be read as one, so both versions
      # now always run to completion and each reports its own verdict.
      fail-fast: false
      matrix:
        node: ['20.20.2','24.19.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - name: Select installed Chromium
        run: |
          chromium_path=$(command -v google-chrome || command -v chromium)
          test -n "$chromium_path"
          echo "MM_TEST_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Run offline launch, settlement, integration and takeover UI tests
        run: PWA_PLAYWRIGHT=playwright-core PWA_CHROMIUM="$MM_TEST_CHROMIUM" node --test test/*.test.mjs

  # The browser suite says nothing about PROPOSAL-up.sql, so the raw fence was
  # operator-attested only. This runs the 10 asserting probes against a throwaway
  # PostgreSQL service, and then a NEGATIVE CONTROL: with the permissive policy removed,
  # probe 3 must fail. A regression that only ever passes proves nothing.
  fence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-not-a-real-secret
          POSTGRES_DB: synthetic
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: synthetic-not-a-real-secret
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Report the engine the probes ran on
        run: psql -d synthetic -tAc 'show server_version'
      - name: Raw fence regression, 10 probes
        run: |
          psql -d synthetic -v ON_ERROR_STOP=1 \
            -f backend/fixture-delivery/local-fence-regression.sql 2>&1 | tee fence.log
          grep -q 'ALL 10 FENCE PROBES PASSED' fence.log
      - name: Preflight predicate has not drifted from the migration
        run: |
          # Probes 9 and 10 exercise the collector preflight's predicate pair. They live in a
          # synthetic replica, so they could drift away from the migration that actually runs.
          # These greps fail the job if PROPOSAL-up.sql stops using the same two expressions.
          # They are the reason an earlier rename of the loop variable was caught here.
          grep -q "has_table_privilege('service_role',pre.oid,'SELECT')" backend/fixture-delivery/PROPOSAL-up.sql
          grep -q "a.grantee=(select oid from pg_roles where rolname='service_role')" backend/fixture-delivery/PROPOSAL-up.sql
          grep -q "has_table_privilege('service_role','public.fixtures','SELECT')" backend/fixture-delivery/local-fence-regression.sql
          grep -q "a.grantee=(select oid from pg_roles where rolname='service_role')" backend/fixture-delivery/local-fence-regression.sql
          echo 'Preflight predicate matches between the migration and the regression.'
      - name: Negative control, the permissive policy removed
        run: |
          # A second FRESH database, and distinct role names, so nothing from the first run is
          # torn down. Roles are CLUSTER-wide, not per database, so every role the regression
          # creates is renamed here too: without that the control aborts on
          # 'role "service_role" already exists' and proves nothing.
          # Dropping and recreating schema public strips its default USAGE grant and
          # makes probe 2 error instead of returning zero rows, which is not the same evidence.
          psql -d postgres -v ON_ERROR_STOP=1 -c 'create database synthetic_control'
          sed -e '/create policy mm_source_raw_read on public.fixtures for select to authenticated/,+1d' \
              -e 's/\banon\b/anon_ctl/g' -e 's/\bauthenticated\b/authenticated_ctl/g' \
              -e 's/\bservice_role\b/service_role_ctl/g' \
              backend/fixture-delivery/local-fence-regression.sql > uncorrected.sql
          ! grep -q 'create policy mm_source_raw_read on public.fixtures for select' uncorrected.sql
          if psql -d synthetic_control -v ON_ERROR_STOP=1 -f uncorrected.sql > control.log 2>&1; then
            echo 'NEGATIVE CONTROL FAILED: the uncorrected proposal passed probe 3'; cat control.log; exit 1
          fi
          grep -q 'FAIL 3: enrolled capability delivered 0 of 2 rows' control.log
          grep -q 'PASS 1: anonymous generic raw read refused' control.log
          grep -q 'PASS 2: ordinary' control.log
          echo 'Negative control held: probe 3 fails without the policy; protections 1 and 2 still pass.'
      - name: Published-edition rolling-window regression, 4 probes
        run: |
          # The public feed went dark for ~5.5h of every UTC day: display() admitted an edition
          # only on its own edition_day, and materialize() clipped expires_at to the next UTC
          # midnight, so the 23:17 run produced a 43-minute edition. These probes assert the
          # rolling window at exact clock times. They create NO roles, so they share a cluster
          # with the fence probes above without colliding.
          psql -d postgres -v ON_ERROR_STOP=1 -c 'create database window16'
          ( cd backend/fixture-delivery && psql -d window16 -v ON_ERROR_STOP=1 \
              -f local-edition-window-regression.sql ) 2>&1 | tee window.log
          grep -q 'ALL 4 ROLLING-WINDOW PROBES PASSED' window.log
      - name: Negative control, the calendar-day rule and the midnight clip put back
        run: |
          # The probes read the two expressions out of PROPOSAL-up.sql, so they can only ever
          # pass because the migration is right. This reconstructs the pre-fix migration -- the
          # edition_day equality in display() and the least(...) clip in materialize() -- and
          # INSISTS each edit applied, then requires the probes to FAIL on it. A regression that
          # only ever passes proves nothing.
          sed -e "s/where as_of<=statement_timestamp()/where edition_day=(statement_timestamp() at time zone 'UTC')::date and as_of<=statement_timestamp()/" \
              -e "s|stamp,stamp+interval '24 hours','existing-published-record-projection/1'|stamp,least(stamp+interval '24 hours',((day_utc+1)::timestamp at time zone 'UTC')),'existing-published-record-projection/1'|" \
              backend/fixture-delivery/PROPOSAL-up.sql > backend/fixture-delivery/prefix-up.sql
          grep -q "where edition_day=(statement_timestamp() at time zone 'UTC')::date and as_of<=" backend/fixture-delivery/prefix-up.sql \
            || { echo 'control could not restore the edition_day admission filter'; exit 1; }
          grep -q "stamp,least(stamp+interval '24 hours',((day_utc+1)::timestamp at time zone 'UTC'))" backend/fixture-delivery/prefix-up.sql \
            || { echo 'control could not restore the midnight clip'; exit 1; }
          psql -d postgres -v ON_ERROR_STOP=1 -c 'create database window16_control'
          # First in the file's default mode, where a failing probe must abort the run: this is
          # the contract CI depends on, and psql exits non-zero.
          if ( cd backend/fixture-delivery && psql -d window16_control -v ON_ERROR_STOP=1 \
                 -v up=prefix-up.sql -f local-edition-window-regression.sql ) > wabort.log 2>&1; then
            echo 'NEGATIVE CONTROL FAILED: the probes passed against the pre-fix migration'
            cat wabort.log; exit 1
          fi
          # Then with ON_ERROR_STOP=off, so every probe records its own verdict. psql exits 0 in
          # that mode whatever happens, so the verdict is read from the log, not the exit code.
          ( cd backend/fixture-delivery && psql -d window16_control -v ON_ERROR_STOP=off \
              -v up=prefix-up.sql -f local-edition-window-regression.sql ) > wcontrol.log 2>&1 || true
          ! grep -q 'ALL 4 ROLLING-WINDOW PROBES PASSED' wcontrol.log
          grep -q 'FAIL 1c: THE BLACKOUT' wcontrol.log
          grep -q 'FAIL 1d: THE BLACKOUT' wcontrol.log
          grep -q 'midnight clip in materialize() is still there' wcontrol.log
          grep -q 'FAIL 3a' wcontrol.log
          grep -q 'only 2 of 4 probes passed' wcontrol.log
          # Fail-closed and the table checks must STILL hold in the pre-fix state: the blackout
          # was never a missing guard, so a control that broke those would be the wrong control.
          grep -q 'PASS 2c' wcontrol.log
          grep -q 'PASS 4b' wcontrol.log
          rm -f backend/fixture-delivery/prefix-up.sql wabort.log
          echo 'Negative control held: probes 1 and 3 fail on the pre-fix migration; 2 and 4 still pass.'

  # The fence job proves the RLS layer in SQL. It says nothing about PostgREST: request shaping,
  # ?select= projection, Range pagination, the JWT role switch or /rpc/. This container has no
  # Docker daemon, so that whole layer was unproven. GitHub runners do have one, and the
  # repository already carries a complete synthetic harness for it.
  postgrest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Confirm a Docker daemon is present
        run: |
          docker version --format 'server {{.Server.Version}}'
          nproc && free -m | head -2 && df -h / | tail -1
      - name: Synthetic Postgres and PostgREST acceptance
        run: |
          # Invented users, invented rows, containers on an internal-only network, images pinned
          # by digest. No hosted URL, no real key, no provider call, no production database.
          mkdir -p "$RUNNER_TEMP/fixture-evidence"
          start=$(date +%s)
          node backend/fixture-delivery/local-integration.mjs \
            --run-local-synthetic "$RUNNER_TEMP/fixture-evidence"
          echo "measured runtime: $(( $(date +%s) - start ))s"
      - name: Report the checks the run recorded
        run: |
          f=$(ls "$RUNNER_TEMP/fixture-evidence"/*.json 2>/dev/null | head -20)
          test -n "$f"
          for j in $f; do echo "== $j"; node -e '
            const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            if(Array.isArray(d.checks)){
              for(const c of d.checks) console.log(" "+c.status+"  "+c.name);
              const bad=d.checks.filter(c=>c.status!=="PASS");
              console.log(" total "+d.checks.length+", failures "+bad.length);
              if(bad.length) process.exit(1);
            } else console.log(" (no check list in this artifact)");
          ' "$j"; done
      - name: Negative control, the restrictive fence removed
        run: |
          # A suite that can only pass proves nothing. Strip the RESTRICTIVE policy out of the
          # migration and the acceptance run must fail. Restored from git afterwards.
          cp backend/fixture-delivery/PROPOSAL-up.sql "$RUNNER_TEMP/up.bak"
          sed -i "/create policy mm_source_raw_fence on %I.%I as restrictive/d" \
            backend/fixture-delivery/PROPOSAL-up.sql
          ! grep -q "mm_source_raw_fence on %I.%I as restrictive" backend/fixture-delivery/PROPOSAL-up.sql
          mkdir -p "$RUNNER_TEMP/control-evidence"
          if node backend/fixture-delivery/local-integration.mjs \
               --run-local-synthetic "$RUNNER_TEMP/control-evidence" > "$RUNNER_TEMP/control.log" 2>&1; then
            echo 'NEGATIVE CONTROL FAILED: acceptance passed with the restrictive fence removed'
            tail -40 "$RUNNER_TEMP/control.log"; exit 1
          fi
          echo 'Negative control held: removing the restrictive fence fails the acceptance run.'
          tail -20 "$RUNNER_TEMP/control.log" || true
          cp "$RUNNER_TEMP/up.bak" backend/fixture-delivery/PROPOSAL-up.sql
          git diff --quiet -- backend/fixture-delivery/PROPOSAL-up.sql
      - name: Remove synthetic containers
        if: always()
        run: |
          # The harness labels its CONTAINERS but creates its network and volume unlabelled,
          # so those are matched by the name prefix it builds them with.
          docker ps -aq --filter label=matchmind.purpose=offline-fixture-delivery | xargs -r docker rm -f
          docker network ls --format '{{.Name}}' | grep '^mm-fixture-delivery-' | xargs -r -n1 docker network rm || true
          docker volume  ls --format '{{.Name}}' | grep '^mm-fixture-delivery-' | xargs -r -n1 docker volume  rm || true
          echo 'remaining:'; docker ps -a --filter label=matchmind.purpose=offline-fixture-delivery

  # PostgreSQL 17, the version production and staging actually run. The fence job above proves the
  # RLS layer on 16 and stays; this job does not replace it. It exists because Director staging on
  # 17.11 found two defects that a local SUPERUSER install cannot see: ownership transfer needs
  # SET ROLE on the new owner, and the auth schema belongs to someone else. So this installs the
  # real migration as a NON-SUPERUSER role administrator against a foreign-owned auth schema.
  hosted17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-not-a-real-secret
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Report the engine, and refuse anything that is not 17
        run: |
          v=$(psql -tAc 'show server_version')
          echo "server_version: $v"
          case "$v" in 17.*) ;; *) echo "expected PostgreSQL 17, got $v"; exit 1;; esac
      - name: The 10 fence probes, on PostgreSQL 17 as well as 16
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'create database fence17'
          psql -d fence17 -v ON_ERROR_STOP=1 \
            -f backend/fixture-delivery/local-fence-regression.sql 2>&1 | tee fence17.log
          grep -q 'ALL 10 FENCE PROBES PASSED' fence17.log
      - name: The 4 rolling-window probes, on PostgreSQL 17 as well as 16
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'create database window17'
          ( cd backend/fixture-delivery && psql -d window17 -v ON_ERROR_STOP=1 \
              -f local-edition-window-regression.sql ) 2>&1 | tee window17.log
          grep -q 'ALL 4 ROLLING-WINDOW PROBES PASSED' window17.log
      - name: Hosted-shape compatibility, non-superuser role administrator
        run: node backend/fixture-delivery/hosted-compat-regression.mjs
      - name: Negative control, the S1 and S2 fixes removed
        run: |
          # The harness in --negative-control mode puts both fixes back out and asserts the
          # migration then FAILS with the two errors Director staging reported. It exits 0 when
          # that holds, so success here is exit 0 PLUS the marker PLUS both error strings; an
          # earlier version of this step read the exit code backwards and reported a held control
          # as a failure.
          node backend/fixture-delivery/hosted-compat-regression.mjs --negative-control > nc.log 2>&1 || {
            echo 'NEGATIVE CONTROL DID NOT HOLD: the migration installed with the fixes removed'
            tail -40 nc.log; exit 1
          }
          grep -q 'NEGATIVE CONTROL HELD' nc.log
          grep -q 'must be able to SET ROLE' nc.log
          grep -q 'no privileges were granted for "auth"' nc.log
          echo 'Negative control held on PostgreSQL 17.'
