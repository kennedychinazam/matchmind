name: MatchMind Staging Anonymous HTTP Acceptance
on:
  push:
    branches:
      - director/staging-auth-http-20261107
    paths:
      - .github/workflows/matchmind-staging-auth-http.yml
permissions:
  contents: read
jobs:
  anonymous-http:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Isolated hosted Auth health and anonymous PostgREST access
        shell: bash
        run: |
          node --input-type=module <<'STAGING_HTTP_TEST'
          const base='https://rdcbnvfnxenrpnnwxszs.supabase.co';
          const key="sb_publishable_WKB88h4KAPtLVphsfNF9fg_W90ym80y";
          if(process.env.GITHUB_REF_NAME!=='director/staging-auth-http-20261107'||!key.startsWith('sb_publishable_')||base.includes('toqfdrcjzwnlydqekude'))throw Error('WRONG_TEST_TARGET');
          const req=async(path,method='GET',body=undefined,headers={})=>{
           const r=await fetch(base+path,{method,headers:{apikey:key,'Content-Type':'application/json',...headers},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
           const raw=await r.text();let data;try{data=raw?JSON.parse(raw):null}catch{data={error:raw.slice(0,180)}}
           return {status:r.status,data};
          };
          let passed=0;
          function check(ok,name,detail=''){if(!ok)throw Error('FAILED '+name+' '+detail);console.log('PASS '+name);passed++;}
          const health=await req('/auth/v1/health');
          check(health.status===200,'hosted_auth_server_health','http '+health.status);
          const history=await req('/rest/v1/rpc/matchmind_display_v1','POST',{screen:'history'});
          check(history.status===200&&Array.isArray(history.data?.cards)&&history.data.cards.length===145,'anonymous_issued_history_145','http '+history.status);
          const hText=JSON.stringify(history.data);
          check(!hText.includes('RAW-PRIVATE')&&!hText.includes('private_raw_marker')&&!hText.includes('provider_blob'),'published_history_excludes_raw_provider_blob');
          const scores=await req('/rest/v1/rpc/matchmind_display_v1','POST',{screen:'scores'});
          check(scores.status===200&&scores.data?.edition_id===history.data?.edition_id,'consistent_published_edition','http '+scores.status);
          const pred=await req('/rest/v1/rpc/matchmind_display_v1','POST',{screen:'predictions'});
          check(pred.status===200&&pred.data?.edition_id===history.data?.edition_id,'predictions_use_same_edition','http '+pred.status);
          const deniedScreen=await req('/rest/v1/rpc/matchmind_display_v1','POST',{screen:'raw'});
          check(deniedScreen.status>=400,'unknown_screen_denied','http '+deniedScreen.status);
          for(const table of ['fixtures','predictions','shared_records','daily_slips','fixtures_lean','provider_alias','odds_latest']){
           const r=await req('/rest/v1/'+table+'?select=*');
           const leaked=r.status===200&&Array.isArray(r.data)&&r.data.length>0;
           check(!leaked,'no_public_raw_feed_'+table,'http '+r.status);
          }
          const forged=await req('/rest/v1/fixtures?select=*','GET',undefined,{'x-postgrest-role':'service_role','role':'service_role'});
          check(!(forged.status===200&&Array.isArray(forged.data)&&forged.data.length>0),'unauthenticated_role_header_not_elevated','http '+forged.status);
          const cap=await req('/rest/v1/rpc/matchmind_fixture_access_v1','POST',{});
          check(cap.status===200&&cap.data?.raw_allowed===false,'anonymous_raw_capability_false','http '+cap.status);
          const publish=await req('/rest/v1/rpc/matchmind_publish_display_v1','POST',{});
          check(publish.status>=400,'anonymous_publisher_denied','http '+publish.status);
          console.log('MATCHMIND_STAGING_ANONYMOUS_HTTP_ACCEPTANCE_PASS '+passed);
          STAGING_HTTP_TEST
