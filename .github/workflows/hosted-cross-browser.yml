name: hosted-cross-browser
# Dispatchable on its own once on the default branch; until then it is reached through
# director-analysis-acceptance.yml (a workflow file must exist on the default branch to be dispatched).
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - run: npx -y playwright@1.63.0 install --with-deps ${{ matrix.browser }}
      - name: Hosted acceptance (${{ matrix.browser }})
        working-directory: staging/mirror
        env:
          MM_BROWSER: ${{ matrix.browser }}
          PWA_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
        run: |
          set -o pipefail
          export MM_EXPECTED_COMMIT="$(curl -fsSL https://kennedychinazam.github.io/matchmind-preview/SOURCE-COMMIT.txt | tr -d '[:space:]')"
          echo "expected commit $MM_EXPECTED_COMMIT"
          node verify-hosted.mjs 2>&1 | tee hosted-${{ matrix.browser }}.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-${{ matrix.browser }}
          path: |
            staging/mirror/*.png
            staging/mirror/*.json
            staging/mirror/*.log
          if-no-files-found: warn
