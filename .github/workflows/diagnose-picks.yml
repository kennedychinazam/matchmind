# MatchMind - the pick-coverage diagnostic (2026-11-21). READ-ONLY: robot/diagnose.mjs serves the
# checked-out index.html locally, signs in as the publisher only to read the raw fixtures, answers
# every database write locally without sending it, and prints why each fixture has or lacks a pick
# plus a walk-forward backtest. Dispatch it on any branch to measure that branch's engine.
name: Diagnose picks

on:
  workflow_dispatch:
    inputs:
      bt_from:
        description: 'Backtest from (YYYY-MM-DD)'
        required: false
        default: '2024-07-01'

permissions:
  contents: write   # only to push the result file to the diag-results branch

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the browser driver
        working-directory: robot
        run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - name: Diagnose
        working-directory: robot
        env:
          MM_PUBLISHER_EMAIL: ${{ secrets.MM_PUBLISHER_EMAIL }}
          MM_PUBLISHER_PASSWORD: ${{ secrets.MM_PUBLISHER_PASSWORD }}
          MM_CHANNEL: chrome
          MM_BT_FROM: ${{ inputs.bt_from }}
        run: set -o pipefail; node diagnose.mjs | tee diag.log
      - name: Save the result to the diag-results branch
        if: always()
        run: |
          cp robot/diag.log /tmp/diag.log
          git config user.name "matchmind-diagnose"
          git config user.email "diagnose@users.noreply.github.com"
          git fetch origin diag-results || true
          git checkout --orphan diag-tmp
          git rm -rq --cached . && git clean -fdq -e diag-profile
          if git rev-parse -q --verify origin/diag-results >/dev/null; then git checkout origin/diag-results -- . || true; fi
          mkdir -p runs && cp /tmp/diag.log "runs/${GITHUB_RUN_ID}-${GITHUB_SHA:0:7}.log"
          git add runs && git commit -qm "diag ${GITHUB_RUN_ID} on ${GITHUB_REF_NAME} ${GITHUB_SHA:0:7}"
          git push -f origin HEAD:diag-results
