name: MatchMind audit regression (development only)
on:
  push:
    branches:
      - feature/matchmind-quality-upgrade
      - codex/phase5-statistical-validation
    paths:
      - 'audits/**'
      - '.github/workflows/audit-regression.yml'
  pull_request:
    branches:
      - feature/matchmind-quality-upgrade
    paths:
      - 'audits/**'
      - '.github/workflows/audit-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['20.20.2', '24.19.0']
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify runtime
        run: node --version
      - name: Execute isolated grading and probability tests
        run: node --test audits/test/*.test.mjs
