name: MatchMind audit regression (development only)
on:
  push:
    branches:
      - feature/matchmind-quality-upgrade
      - codex/phase3-immutable-snapshots
      - codex/phase6-shadow-feasibility
      - codex/phase7-receipt-verified-training
      - codex/phase8-weekend-testing-ai
    paths:
      - 'audits/**'
      - '.github/workflows/audit-regression.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-*.png'
  pull_request:
    branches:
      - codex/phase7-receipt-verified-training
      - feature/matchmind-quality-upgrade
      - codex/phase3-immutable-snapshots
      - codex/phase6-shadow-feasibility
    paths:
      - 'audits/**'
      - '.github/workflows/audit-regression.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon-*.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-regressions:
    if: github.ref == 'refs/heads/feature/matchmind-quality-upgrade' || github.ref == 'refs/heads/codex/phase3-immutable-snapshots' || github.ref == 'refs/heads/codex/phase6-shadow-feasibility' || github.ref == 'refs/heads/codex/phase7-receipt-verified-training' || github.ref == 'refs/heads/codex/phase8-weekend-testing-ai' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20.20.2', '24.19.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked audit browser driver
        run: npm ci --prefix audits --ignore-scripts --no-audit --no-fund
      - name: Select installed Chromium
        run: |
          chromium_path=$(command -v google-chrome || command -v chromium)
          test -n "$chromium_path"
          echo "MM_TEST_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
      - name: Pull isolated PostgreSQL image
        run: docker --host=unix:///var/run/docker.sock pull postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
      - name: Execute all local regressions
        run: node --test audits/test/*.test.mjs
